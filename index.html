<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Art Gallery - Portfolio Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading Gallery...</p>
    </div>

    <div id="gallery-container">
        <canvas id="gallery-canvas"></canvas>
    </div>

    <div id="ui-controls">
        <div class="control-panel">
            <h3>Gallery Controls</h3>
            <div class="control-group">
                <label>Camera Presets:</label>
                <button id="preset-overview">Overview</button>
                <button id="preset-close">Close View</button>
                <button id="preset-side">Side View</button>
            </div>
            <div class="control-group">
                <label>Lighting:</label>
                <button id="toggle-lights">Toggle Lights</button>
                <button id="cycle-lighting">Cycle Mode</button>
                <button id="toggle-particles">Particles</button>
            </div>
            <div class="control-group">
                <label>Effects:</label>
                <button id="auto-rotate">Auto Rotate</button>
                <button id="toggle-fog">Fog Effect</button>
            </div>
            <div class="control-group">
                <label>Settings:</label>
                <button id="reset-camera">Reset View</button>
                <button id="fullscreen">Fullscreen</button>
            </div>
        </div>
        <div class="info-panel">
            <h3>Art Gallery</h3>
            <p>Navigate with mouse to explore the 3D gallery</p>
            <p>Click and drag to rotate • Scroll to zoom</p>
            <div class="artwork-navigation">
                <h4>Artwork Navigation</h4>
                <div class="artwork-info">
                    <span id="current-artwork">1</span> of <span id="total-artworks">5</span>
                </div>
                <div class="navigation-hint">
                    <p>Click artwork to zoom • Use ← → arrows to navigate</p>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">FPS:</span>
                    <span id="fps-counter">60</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Particles:</span>
                    <span id="particle-count">1000</span>
                </div>
            </div>
        </div>
    </div>

    <div id="particle-controls" class="particle-panel">
        <h4>Particle Settings</h4>
        <div class="slider-group">
            <label>Count: <span id="particle-count-display">1000</span></label>
            <input type="range" id="particle-count-slider" min="100" max="5000" value="1000">
        </div>
        <div class="slider-group">
            <label>Speed: <span id="particle-speed-display">1.0</span></label>
            <input type="range" id="particle-speed-slider" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="slider-group">
            <label>Size: <span id="particle-size-display">1.0</span></label>
            <input type="range" id="particle-size-slider" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>

</html>
